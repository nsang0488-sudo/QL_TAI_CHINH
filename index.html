<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Chính Cá Nhân & Kinh Doanh</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Auth / Key Check Screen -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex items-center justify-center w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl mb-4 mx-auto">
                <i data-lucide="wallet"></i>
            </div>
            <h1 class="text-xl font-bold text-center text-white mb-2">Quản Lý Tài Chính</h1>
            <p class="text-xs text-slate-400 text-center mb-6">Mã truy cập giúp đồng bộ và bảo mật dữ liệu Firebase của bạn.</p>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Mã truy cập (Access Key)</label>
                    <input type="password" id="accessKeyInput" placeholder="Nhập mã truy cập..." required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-slate-500">
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2.5 rounded-xl transition duration-200 text-sm flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Truy Cập Hệ Thống
                </button>
            </form>
        </div>
    </div>

    <!-- Main Application UI -->
    <div id="mainApp" class="hidden max-w-4xl mx-auto px-4 pt-6">
        <!-- Top Bar -->
        <header class="flex items-center justify-between pb-6 border-b border-slate-800 mb-6">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                    <i data-lucide="coins" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Sổ Thu Chi Firebase</h1>
                    <p class="text-xs text-slate-400">Đồng bộ dữ liệu thời gian thực</p>
                </div>
            </div>
            <button onclick="logout()" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition" title="Đăng xuất">
                <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Balance Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Balance Card -->
            <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-medium text-slate-400">Số Dư Hiện Tại</span>
                    <i data-lucide="scale" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div id="totalBalance" class="text-2xl font-bold text-white mb-1">0 ₫</div>
                <p class="text-[11px] text-slate-400">Thu nhập ròng khả dụng</p>
            </div>

            <!-- Income Card -->
            <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-medium text-emerald-400">Tổng Thu</span>
                    <i data-lucide="arrow-down-left" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div id="totalIncome" class="text-xl font-bold text-emerald-400 mb-1">+0 ₫</div>
                <p class="text-[11px] text-slate-400">Các khoản tiền vào</p>
            </div>

            <!-- Expense Card -->
            <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-medium text-rose-400">Tổng Chi</span>
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-rose-400"></i>
                </div>
                <div id="totalExpense" class="text-xl font-bold text-rose-400 mb-1">-0 ₫</div>
                <p class="text-[11px] text-slate-400">Các khoản chi tiêu / đầu tư</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-slate-800/50 border border-slate-800 rounded-2xl p-5 mb-8">
            <h2 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Thêm Giao Dịch Mới
            </h2>
            
            <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- Type -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Loại Giao Dịch</label>
                        <select id="txType" required onchange="updateCategories()"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="expense">Khoản Chi (-)</option>
                            <option value="income">Khoản Thu (+)</option>
                        </select>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Số Tiền (VNĐ)</label>
                        <input type="number" id="txAmount" placeholder="0" min="1000" step="1000" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>

                    <!-- Category -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Danh Mục</label>
                        <select id="txCategory" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- Date -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Ngày Ghi Nhận</label>
                        <input type="date" id="txDate" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <!-- Payment Method -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Phương Thức</label>
                        <select id="txMethod" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="Chuyển khoản">Chuyển khoản (CK)</option>
                            <option value="Tiền mặt">Tiền mặt</option>
                            <option value="Thẻ tín dụng">Thẻ tín dụng</option>
                        </select>
                    </div>

                    <!-- Note -->
                    <div class="sm:col-span-2">
                        <label class="block text-xs text-slate-400 mb-1">Ghi Chú / Chi Tiết</label>
                        <input type="text" id="txNote" placeholder="Ví dụ: Mua nguyên liệu quầy bar, Tiền xăng xe..." required
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition text-sm flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Lưu Giao Dịch
                    </button>
                </div>
            </form>
        </div>

        <!-- Transactions List Section -->
        <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                    <i data-lucide="list-ordered" class="w-4 h-4 text-emerald-400"></i> Lịch Sử Giao Dịch
                </h2>

                <!-- Filters -->
                <div class="flex items-center gap-2">
                    <select id="filterType" onchange="renderTransactions()" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-300">
                        <option value="all">Tất cả loại</option>
                        <option value="income">Chỉ khoản thu</option>
                        <option value="expense">Chỉ khoản chi</option>
                    </select>
                    <input type="text" id="searchInput" onkeyup="renderTransactions()" placeholder="Tìm ghi chú..." 
                        class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- List Container -->
            <div id="transactionList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                <!-- Transactions will be loaded here dynamically -->
            </div>
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuration matching Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://auto-72a39-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let accessKey = '';
        let transactions = [];

        const categories = {
            expense: ["Ăn uống", "Quầy Bar / Cửa hàng", "Xe cộ & Đi lại", "Trading / Đầu tư", "Sinh hoạt / Nhà cửa", "Giải trí", "Khác"],
            income: ["Doanh thu bán hàng", "Thu nhập Trading", "Lương / Thưởng", "Thu nợ", "Khác"]
        };

        // Make functions globally available
        window.handleAuth = function(e) {
            e.preventDefault();
            const key = document.getElementById('accessKeyInput').value.trim();
            if (key) {
                accessKey = key;
                localStorage.setItem('fin_access_key', key);
                initApp();
            }
        };

        window.logout = function() {
            localStorage.removeItem('fin_access_key');
            location.reload();
        };

        window.updateCategories = function() {
            const type = document.getElementById('txType').value;
            const categorySelect = document.getElementById('txCategory');
            categorySelect.innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
        };

        function initApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
            window.updateCategories();

            // Listen to Realtime Database changes under node based on accessKey
            const txRef = ref(db, `finance_records/${accessKey}`);
            onValue(txRef, (snapshot) => {
                const data = snapshot.val();
                transactions = [];
                if (data) {
                    Object.keys(data).forEach(id => {
                        transactions.push({ id, ...data[id] });
                    });
                    transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                }
                updateSummary();
                renderTransactions();
            });
        }

        window.addTransaction = function(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const category = document.getElementById('txCategory').value;
            const date = document.getElementById('txDate').value;
            const method = document.getElementById('txMethod').value;
            const note = document.getElementById('txNote').value.trim();

            if (!amount || amount <= 0) return;

            const newTx = {
                type,
                amount,
                category,
                date,
                method,
                note,
                createdAt: Date.now()
            };

            const txRef = ref(db, `finance_records/${accessKey}`);
            push(txRef, newTx).then(() => {
                document.getElementById('txAmount').value = '';
                document.getElementById('txNote').value = '';
            }).catch(err => alert("Lỗi khi kết nối Firebase: " + err.message));
        };

        window.deleteTransaction = function(id) {
            if (confirm("Bạn có chắc chắn muốn xóa giao dịch này không?")) {
                const itemRef = ref(db, `finance_records/${accessKey}/${id}`);
                remove(itemRef);
            }
        };

        function updateSummary() {
            let income = 0;
            let expense = 0;

            transactions.forEach(t => {
                if (t.type === 'income') income += t.amount;
                if (t.type === 'expense') expense += t.amount;
            });

            const balance = income - expense;

            document.getElementById('totalBalance').innerText = formatCurrency(balance);
            document.getElementById('totalIncome').innerText = '+' + formatCurrency(income);
            document.getElementById('totalExpense').innerText = '-' + formatCurrency(expense);
        }

        window.renderTransactions = function() {
            const listEl = document.getElementById('transactionList');
            const filterType = document.getElementById('filterType').value;
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = transactions.filter(t => {
                const matchType = filterType === 'all' || t.type === filterType;
                const matchSearch = t.note.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                return matchType && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-xs">
                        Chưa có giao dịch nào được ghi nhận.
                    </div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-slate-800 rounded-xl hover:border-slate-700 transition">
                    <div class="flex items-center gap-3">
                        <div class="p-2 rounded-lg ${t.type === 'income' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                            <i data-lucide="${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-white">${escapeHtml(t.note)}</div>
                            <div class="flex items-center gap-2 text-[11px] text-slate-400 mt-0.5">
                                <span class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">${t.category}</span>
                                <span>•</span>
                                <span>${t.method}</span>
                                <span>•</span>
                                <span>${t.date}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div class="text-sm font-bold ${t.type === 'income' ? 'text-emerald-400' : 'text-rose-400'}">
                                ${t.type === 'income' ? '+' : '-'}${formatCurrency(t.amount)}
                            </div>
                        </div>
                        <button onclick="deleteTransaction('${t.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Xóa">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Auto login if key stored
        const savedKey = localStorage.getItem('fin_access_key');
        if (savedKey) {
            accessKey = savedKey;
            initApp();
        }

        lucide.createIcons();
    </script>
</body>
</html>
